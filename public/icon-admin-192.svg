<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="admin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A26"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="admin-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="192" height="192" rx="42" fill="url(#admin-bg)"/>

  <!-- Golden perimeter frame -->
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Center emblem: Chef Hat + Crossed Utensils & Control Shield -->
  <g filter="url(#admin-shadow)" transform="translate(16, 14)">
    <!-- Backing glow circle -->
    <circle cx="80" cy="80" r="62" fill="#F59E0B" fill-opacity="0.12"/>
    <circle cx="80" cy="80" r="54" fill="#1E293B" stroke="url(#gold-grad)" stroke-width="2"/>

    <!-- Chef Hat Symbol -->
    <path d="M60 74 C50 74 46 62 54 54 C52 42 66 36 76 42 C82 32 98 32 104 42 C114 36 128 42 126 54 C134 62 130 74 120 74 Z" fill="url(#gold-grad)"/>
    <!-- Hat band -->
    <rect x="58" y="74" width="64" height="12" rx="3" fill="#D97706"/>
    <!-- Band line accents -->
    <line x1="66" y1="80" x2="114" y2="80" stroke="#FEF08A" stroke-width="2" stroke-linecap="round"/>

    <!-- Crossed Spatula & Knife / Star Badge -->
    <path d="M68 96 L92 118" stroke="url(#gold-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M92 96 L68 118" stroke="url(#gold-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="80" cy="107" r="7" fill="url(#flame-grad)"/>

    <!-- Subtle Live Kitchen Flame Pill -->
    <g transform="translate(42, 128)">
      <rect width="76" height="20" rx="10" fill="url(#flame-grad)"/>
      <text x="38" y="14" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1.2">KITCHEN</text>
    </g>
  </g>
</svg>
