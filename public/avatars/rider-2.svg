<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="jacket2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cap2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-amber)" stroke="#ffffff" stroke-width="4"/>

  <!-- Subtle glow ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Shoulders & Delivery Uniform -->
  <path d="M22 108 C24 88, 38 78, 60 78 C82 78, 96 88, 98 108 Z" fill="url(#jacket2)"/>
  <path d="M48 82 L60 98 L72 82 Z" fill="#f59e0b"/>
  <circle cx="60" cy="98" r="2.5" fill="#ffffff"/>

  <!-- Neck -->
  <rect x="52" y="66" width="16" height="14" rx="4" fill="#fed7aa"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="54" rx="18" ry="19" fill="#fed7aa"/>

  <!-- Ears & Headset -->
  <circle cx="42" cy="54" r="4.5" fill="#fba866"/>
  <circle cx="78" cy="54" r="4.5" fill="#fba866"/>
  <path d="M40 50 C40 38, 48 34, 60 34 C72 34, 80 38, 80 50" stroke="#0f172a" stroke-width="2.5" fill="none"/>
  <rect x="38" y="48" width="5" height="12" rx="2.5" fill="#0f172a"/>
  <!-- Microphone arm -->
  <path d="M40 57 Q46 64 54 63" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="55" cy="63" r="2.5" fill="#f59e0b"/>

  <!-- Eyes & Eyebrows -->
  <circle cx="53" cy="54" r="2.5" fill="#1e293b"/>
  <circle cx="67" cy="54" r="2.5" fill="#1e293b"/>
  <path d="M50 49 Q53 47 56 49" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M64 49 Q67 47 70 49" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Smile -->
  <path d="M54 62 Q60 67 66 62" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Delivery Cap / Baseball Hat -->
  <path d="M38 46 C38 32, 48 26, 60 26 C72 26, 82 32, 82 46 Z" fill="url(#cap2)"/>
  <!-- Cap Visor -->
  <path d="M36 44 C42 42, 60 42, 88 44 C92 45, 90 48, 82 50 C70 51, 46 51, 36 44 Z" fill="#9a3412"/>
  <!-- SAS Logo Star on Cap -->
  <circle cx="60" cy="36" r="4" fill="#fde68a"/>
  <path d="M60 33 L61 35 L63 35 L61.5 36.5 L62 39 L60 37.5 L58 39 L58.5 36.5 L57 35 L59 35 Z" fill="#ea580c"/>

  <!-- Scooter Badge bottom right -->
  <circle cx="94" cy="94" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="94" y="99" font-size="14" text-anchor="middle">🛵</text>
</svg>
