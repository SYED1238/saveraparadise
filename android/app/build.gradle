plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sascrispy.portal'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (file("release.jks").exists()) {
                storeFile file("release.jks")
                // Read release signing credentials from environment variables (CI/Secrets) with local-dev fallback
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "SaveraParadise2026!"
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "saveraparadise"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "SaveraParadise2026!"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig file("release.jks").exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "portal"
    productFlavors {
        admin {
            dimension "portal"
            applicationId "com.saveraparadise.kitchen"
            resValue "string", "app_name", "Savera Paradise Kitchen"
            resValue "string", "portal_url", "https://saveraparadise.foodbliz.in/admin"
            resValue "color", "theme_color", "#0F172A"
        }
        kitchenPlay {
            dimension "portal"
            applicationId "com.foodbliz.kitchen"
            versionCode 2
            versionName "1.0.1"
            resValue "string", "app_name", "FoodBliz Kitchen"
            resValue "string", "portal_url", "https://kitchen.foodbliz.in"
            resValue "color", "theme_color", "#1C1410"
        }
        rider {
            dimension "portal"
            applicationId "com.foodbliz.rider"
            versionCode 13
            versionName "1.2.1"
            resValue "string", "app_name", "Foodbliz Rider"
            resValue "string", "portal_url", "https://rider.foodbliz.in"
            resValue "color", "theme_color", "#059669"
        }
        owner {
            dimension "portal"
            applicationId "com.saveraparadise.owner"
            resValue "string", "app_name", "Savera Paradise Owner"
            resValue "string", "portal_url", "https://saveraparadise.foodbliz.in/owner"
            resValue "color", "theme_color", "#0B0F17"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'
}
