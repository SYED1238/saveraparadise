plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sascrispy.portal'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "portal"
    productFlavors {
        admin {
            dimension "portal"
            applicationId "com.saveraparadise.kitchen"
            resValue "string", "app_name", "Savera Paradise Kitchen"
            resValue "string", "portal_url", "https://saveraparadise.com/admin.html"
            resValue "color", "theme_color", "#0F172A"
        }
        rider {
            dimension "portal"
            applicationId "com.saveraparadise.rider"
            resValue "string", "app_name", "Savera Paradise Rider"
            resValue "string", "portal_url", "https://saveraparadise.com/delivery.html"
            resValue "color", "theme_color", "#059669"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
