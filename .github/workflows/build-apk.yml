name: Build Android APKs (Admin, Rider & Owner)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish direct download links in GitHub Releases?'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apks:
    name: Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode or Generate Production Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding production release keystore from secrets..."
            python3 -c "import os, base64; raw = base64.b64decode(os.environ.get('KEYSTORE_BASE64', '').strip()); open('release.jks', 'wb').write(raw); print(f'Successfully decoded release.jks ({len(raw)} bytes).')" || {
              echo "Python decode fallback: using coreutils base64..."
              printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode --ignore-garbage > release.jks
            }
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret is unset. Generating fallback release keystore with default credentials."
            keytool -genkey -v -keystore release.jks -alias saveraparadise -keyalg RSA -keysize 2048 -validity 10000 -storepass "SaveraParadise2026!" -keypass "SaveraParadise2026!" -dname "CN=Savera Paradise, OU=Mobile, O=Savera Paradise, L=Bengaluru, ST=Karnataka, C=IN"
          fi
          if [ ! -s release.jks ]; then
            echo "ERROR: release.jks was not generated or is empty!"
            exit 1
          fi

      - name: Build Admin, Rider, and Owner APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'SaveraParadise2026!' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'saveraparadise' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'SaveraParadise2026!' }}
        run: |
          cd android
          gradle assembleAdminRelease assembleRiderRelease assembleOwnerRelease --no-daemon --stacktrace

      - name: Build Foodbliz Rider Play Store AAB Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'SaveraParadise2026!' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'saveraparadise' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'SaveraParadise2026!' }}
        run: |
          cd android
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
            chmod +x gradlew
          fi
          ./gradlew bundleRiderRelease --no-daemon --stacktrace

      - name: Upload Foodbliz Rider Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodbliz-rider-playstore-aab
          path: android/app/build/outputs/bundle/riderRelease/app-rider-release.aab
          retention-days: 30

      - name: Build FoodBliz Kitchen Play Store AAB Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'SaveraParadise2026!' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'saveraparadise' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'SaveraParadise2026!' }}
        run: |
          cd android
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
            chmod +x gradlew
          fi
          ./gradlew bundleKitchenPlayRelease --no-daemon --stacktrace

      - name: Upload FoodBliz Kitchen Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodbliz-kitchen-playstore-aab
          path: android/app/build/outputs/bundle/kitchenPlayRelease/app-kitchenPlay-release.aab
          retention-days: 30

      - name: Organize APK Artifacts
        run: |
          mkdir -p dist-apks
          # Locate and copy built APKs
          find android/app/build/outputs/apk/admin/release -name "*.apk" -exec cp {} dist-apks/Savera-Kitchen-Admin.apk \;
          find android/app/build/outputs/apk/rider/release -name "*.apk" -exec cp {} dist-apks/Savera-Paradise-Rider.apk \;
          find android/app/build/outputs/apk/owner/release -name "*.apk" -exec cp {} dist-apks/Savera-Paradise-Owner.apk \;
          ls -la dist-apks/

      - name: Auto-Update public/apk/ in Repository
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/apk
          cp dist-apks/Savera-Kitchen-Admin.apk public/apk/Savera-Kitchen-Admin.apk
          cp dist-apks/Savera-Paradise-Rider.apk public/apk/Savera-Paradise-Rider.apk
          cp dist-apks/Savera-Paradise-Owner.apk public/apk/Savera-Paradise-Owner.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/apk/*.apk
          git commit -m "chore: update built APKs in public/apk [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped or no changes"

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Savera-Paradise-Android-APKs
          path: dist-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with Direct APK Downloads
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Savera Paradise Android APKs (Admin, Rider & Owner)"
          body: |
            ### 📱 Official Android APK Downloads for Savera Paradise

            These standalone native Android APKs run dedicated portals without browser address bars, keep the screen awake during service hours, and prevent tab sleep:

            * 👨‍🍳 **[Download Savera Kitchen Admin APK](https://github.com/${{ github.repository }}/releases/download/latest-apk/Savera-Kitchen-Admin.apk)**
              * Kitchen order display, loud incoming order beeper sirens, menu 86/stock toggle, and rush setter.
            * 🏍️ **[Download Savera Paradise Rider APK](https://github.com/${{ github.repository }}/releases/download/latest-apk/Savera-Paradise-Rider.apk)**
              * Delivery fleet dispatch, live turn-by-turn customer doorstep navigation, and cash-on-delivery tracking.
            * 👑 **[Download Savera Paradise Owner APK](https://github.com/${{ github.repository }}/releases/download/latest-apk/Savera-Paradise-Owner.apk)**
              * Executive owner command center, sales analytics, store settings, UPI settlements, and audit logs.

            ---
            *Built automatically via GitHub Actions.*
          files: |
            dist-apks/Savera-Kitchen-Admin.apk
            dist-apks/Savera-Paradise-Rider.apk
            dist-apks/Savera-Paradise-Owner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
