name: Build Android APKs (Admin, Rider & Owner)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish direct download links in GitHub Releases?'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apks:
    name: Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Admin, Rider, and Owner APKs
        run: |
          cd android
          gradle assembleAdminRelease assembleRiderRelease assembleOwnerRelease --no-daemon --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p dist-apks
          # Locate and copy built APKs
          find android/app/build/outputs/apk/admin/release -name "*.apk" -exec cp {} dist-apks/Savera-Kitchen-Admin.apk \;
          find android/app/build/outputs/apk/rider/release -name "*.apk" -exec cp {} dist-apks/Savera-Paradise-Rider.apk \;
          find android/app/build/outputs/apk/owner/release -name "*.apk" -exec cp {} dist-apks/Savera-Paradise-Owner.apk \;
          ls -la dist-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Savera-Paradise-Android-APKs
          path: dist-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with Direct APK Downloads
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Savera Paradise Android APKs (Admin, Rider & Owner)"
          body: |
            ### 📱 Official Android APK Downloads for Savera Paradise

            These standalone native Android APKs run dedicated portals without browser address bars, keep the screen awake during service hours, and prevent tab sleep:

            * 👨‍🍳 **[Download Savera Kitchen Admin APK](https://github.com/${{ github.repository }}/releases/download/latest-apk/Savera-Kitchen-Admin.apk)**
              * Kitchen order display, loud incoming order beeper sirens, menu 86/stock toggle, and rush setter.
            * 🏍️ **[Download Savera Paradise Rider APK](https://github.com/${{ github.repository }}/releases/download/latest-apk/Savera-Paradise-Rider.apk)**
              * Delivery fleet dispatch, live turn-by-turn customer doorstep navigation, and cash-on-delivery tracking.
            * 👑 **[Download Savera Paradise Owner APK](https://github.com/${{ github.repository }}/releases/download/latest-apk/Savera-Paradise-Owner.apk)**
              * Executive owner command center, sales analytics, store settings, UPI settlements, and audit logs.

            ---
            *Built automatically via GitHub Actions.*
          files: |
            dist-apks/Savera-Kitchen-Admin.apk
            dist-apks/Savera-Paradise-Rider.apk
            dist-apks/Savera-Paradise-Owner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
