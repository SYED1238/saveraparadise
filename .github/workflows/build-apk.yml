name: Build Android APKs (Admin & Rider)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish direct download links in GitHub Releases?'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apks:
    name: Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Admin and Rider APKs
        run: |
          cd android
          gradle assembleAdminRelease assembleRiderRelease --no-daemon --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p dist-apks
          # Locate and copy built APKs
          find android/app/build/outputs/apk/admin/release -name "*.apk" -exec cp {} dist-apks/SAS-Kitchen-Admin.apk \;
          find android/app/build/outputs/apk/rider/release -name "*.apk" -exec cp {} dist-apks/SAS-Crispy-Rider.apk \;
          ls -la dist-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SAS-Crispy-Android-APKs
          path: dist-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with Direct APK Downloads
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "SAS Crispy Android APKs (Admin & Rider)"
          body: |
            ### 📱 Official Android APK Downloads for SAS Crispy Chicken

            These standalone native Android APKs run dedicated portals without browser address bars, keep the screen awake during service hours, and prevent tab sleep:

            * 👨‍🍳 **[Download SAS Kitchen Admin APK](https://github.com/${{ github.repository }}/releases/download/latest-apk/SAS-Kitchen-Admin.apk)**
              * Kitchen order display, loud incoming order beeper sirens, menu 86/stock toggle, and rush setter.
            * 🏍️ **[Download SAS Crispy Rider APK](https://github.com/${{ github.repository }}/releases/download/latest-apk/SAS-Crispy-Rider.apk)**
              * Delivery fleet dispatch, live turn-by-turn customer doorstep navigation, and cash-on-delivery tracking.

            ---
            *Built automatically via GitHub Actions.*
          files: |
            dist-apks/SAS-Kitchen-Admin.apk
            dist-apks/SAS-Crispy-Rider.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
