name: Build Savera Paradise Customer TWA (Google Play AAB & APK)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish direct download links in GitHub Releases?'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'android-customer-twa/**'
      - '.github/workflows/build-customer-twa.yml'

permissions:
  contents: write

jobs:
  build-customer-twa:
    name: Build Customer Play Store TWA (AAB & APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode or Generate Production Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd android-customer-twa/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding production release keystore from secrets..."
            python3 -c "import os, base64; raw = base64.b64decode(os.environ.get('KEYSTORE_BASE64', '').strip()); open('release.jks', 'wb').write(raw); print(f'Successfully decoded release.jks ({len(raw)} bytes).')" || {
              echo "Python decode fallback: using coreutils base64..."
              printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release.jks
            }
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret is unset. Generating fallback release keystore with default credentials."
            keytool -genkey -v -keystore release.jks -alias saveraparadise -keyalg RSA -keysize 2048 -validity 10000 -storepass "SaveraParadise2026!" -keypass "SaveraParadise2026!" -dname "CN=Savera Paradise, OU=Mobile, O=Savera Paradise, L=Bengaluru, ST=Karnataka, C=IN"
          fi
          if [ ! -s release.jks ]; then
            echo "ERROR: release.jks was not generated or is empty!"
            exit 1
          fi

      - name: Build Savera Paradise Customer Play Store AAB Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'SaveraParadise2026!' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'saveraparadise' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'SaveraParadise2026!' }}
        run: |
          cd android-customer-twa
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
            chmod +x gradlew
          fi
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build Savera Paradise Customer Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'SaveraParadise2026!' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'saveraparadise' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'SaveraParadise2026!' }}
        run: |
          cd android-customer-twa
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Organize Artifacts
        run: |
          mkdir -p dist-customer
          cp android-customer-twa/app/build/outputs/bundle/release/*.aab dist-customer/Savera-Paradise-Customer.aab || cp android-customer-twa/app/build/outputs/bundle/release/app-release.aab dist-customer/Savera-Paradise-Customer.aab
          cp android-customer-twa/app/build/outputs/apk/release/*.apk dist-customer/Savera-Paradise-Customer.apk || cp android-customer-twa/app/build/outputs/apk/release/app-release.apk dist-customer/Savera-Paradise-Customer.apk
          ls -la dist-customer/

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: savera-paradise-customer-playstore-aab
          path: dist-customer/Savera-Paradise-Customer.aab
          retention-days: 30

      - name: Upload Customer Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: savera-paradise-customer-release-apk
          path: dist-customer/Savera-Paradise-Customer.apk
          retention-days: 30

      - name: Create or Update GitHub Release with Customer App Artifacts
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-customer-twa
          name: "Savera Paradise Customer TWA (Google Play AAB & APK)"
          body: |
            ### 🛒 Official Google Play Store Customer App (Trusted Web Activity)

            * **Package Name:** `com.saveraparadise.app`
            * **Launch URL:** `https://saveraparadise.foodbliz.in/`
            * **Architecture:** Chrome Trusted Web Activity (Target SDK 36, Zero Foreground Service permissions)
            * **SHA-256 Fingerprint:** `4D:A4:8E:A0:71:6D:58:F9:92:DB:1A:67:65:C2:85:73:B4:3C:9D:26:9E:73:C8:3E:4E:19:AE:88:95:B5:7A:3A`

            #### 📦 Downloads:
            * **Google Play Bundle:** [Download Savera-Paradise-Customer.aab](https://github.com/${{ github.repository }}/releases/download/latest-customer-twa/Savera-Paradise-Customer.aab)
            * **Direct APK Install:** [Download Savera-Paradise-Customer.apk](https://github.com/${{ github.repository }}/releases/download/latest-customer-twa/Savera-Paradise-Customer.apk)

            ---
            *Built and signed automatically via GitHub Actions.*
          files: |
            dist-customer/Savera-Paradise-Customer.aab
            dist-customer/Savera-Paradise-Customer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
